<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Perfect Center</title>
</head>
<body>
    <div class="container">
        <div class="perfect-center">
            <div class="center-item">
                Center div
            </div>
        </div>
        <div class="row">
            <h3>Row</h3>
            <div class="flex-row">
                <div class="flex-item">Item 1</div>
                <div class="flex-item">Item 2</div>
                <div class="flex-item">Item 3</div>
                <div class="flex-item">Item 4</div>
                <div class="flex-item">Item 5</div>
                <div class="flex-item">Item 6</div>
                
            </div>
        </div>
        <div class="column-stack">
            <div class="stact-heading">
                <p>Column Stack</p>
            </div>
            <div class="col-stack-div">
                <div class="stack-item">Item 1</div>
                <div class="stack-item">Item 2</div>
                <div class="stack-item">Item 3</div>
            </div>
            <div class="stact-heading-bottom">
                <p>flex-direction</p>
            </div>
        </div>
        <div class="spac-between-div">
            <div class="stact-heading">
                <p>Space betwen</p>
            </div>
            
            <div class="stact-heading-bottom">
                <p>justify-content:space between</p>
            </div>
        </div>
    </div>
</body>
</html>

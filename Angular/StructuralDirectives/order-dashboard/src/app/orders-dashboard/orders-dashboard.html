<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h3 class="mb-1">Orders Dashboard</h3>
            <div class="text-muted">
                Live Order Monitoring Dashboard Paginate & View Details
            </div>
        </div>
    </div>
    <!-- Filter -->
     <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
            <div class="row g-2 align-item-center">
                <div class="col-12 col-lg-5">
                    <div class="input-group">
                        <span class="input-group-text">Search</span>
                        <input [value]="searchText" class="form-control"
                        (input)="onSearchChange(($any($event.target)).value)" placeholder="Search by Id, Customer, Phone, City, Tracking...">
                        <button class="btn btn-primary" type="button" (click)="clearSearch()" [disabled]="!searchText.trim()">Clear</button>
                    </div>
                </div>
            </div>
            <!-- Status Filter: -->
             <div class="col-12 col-lg-5">
                <div class="d-flex-flex-wrap gap-2">
                    <button class="btn btn-sm" 
                    [class]="selectedStatus==='All'? 'btn-dark':'btn-outline-dark'"
                    (click)="setStatus('All')" >All</button>

                    <button class="btn btn-sm" 
                    [class]="selectedStatus==='Pending'? 'btn-warning':'btn-outline-warning'"
                    (click)="setStatus('Pending')" >Pending</button>

                    <button class="btn btn-sm" 
                    [class]="selectedStatus==='Confirmed'? 'btn-primary':'btn-outline-primary'"
                    (click)="setStatus('Confirmed')" >Confirmed</button>

                    <button class="btn btn-sm" 
                    [class]="selectedStatus==='Shipped'? 'btn-info':'btn-outline-info'"
                    (click)="setStatus('Shipped')" >Shipped</button>

                    <button class="btn btn-sm" 
                    [class]="selectedStatus==='Delivered'? 'btn-success':'btn-outline-success'"
                    (click)="setStatus('Delivered')" >Delivered</button>

                    <button class="btn btn-sm" 
                    [class]="selectedStatus==='Cancelled'? 'btn-danger':'btn-outline-danger'"
                    (click)="setStatus('Cancelled')" >Cancelled</button>
                </div>
             </div>
             <!-- Page Size -->
              <div class="col-12 col-lg-2">
                <div class="d-flex justify-content-lg-end align-items-center gap-2">
                  <span class="text-muted small">Rows:</span>
                    <select class="form-select form-select-sm w-auto" [value]="pageSize" (change)="changePageSize(($any($event.target)).value)">
                        @for (s of pageSizeOptions; track s) {
                            <option [value]="s">{{s}}</option>
                        }
                    </select>
                </div>
              </div>
        </div>
     </div>
</div>
<!-- Table -->
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-3">Order ID</th>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>City</th>
                        <th>Date</th>
                        <th class="text-center">Items</th>
                        <th>Tracking</th>
                        <th>Status</th>
                        <th>Payment</th>
                        <th>Delivery</th>
                        <th>Courier</th>
                        <th class="text-end">Total</th>
                        <th class="text-end pe-e">Action</th>
                    </tr>
                </thead>
                <tbody>
                    @if (pagedOrders.length === 0) {
                        <tr>
                            <td colspan="13" class="text-center text-muted py-3">No orders found.</td>
                        </tr>

                    }@else{
                         @for (pagedOrder of pagedOrders; track pagedOrder.id) {
                            
                        }
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>

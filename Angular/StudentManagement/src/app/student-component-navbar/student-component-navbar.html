<header class="topbar">
    <button
        class="mobile-menu-button"
        type="button"
        [class.open]="mobileMenuOpen"
        [attr.aria-expanded]="mobileMenuOpen"
        [attr.aria-label]="mobileMenuOpen ? 'Close navigation menu' : 'Open navigation menu'"
        aria-controls="main-navigation"
        (click)="mobileMenuToggle.emit()"
    >
        <span aria-hidden="true"></span>
    </button>
    <div class="page-heading">
        <span class="breadcrumb">Workspace</span>
        <span class="breadcrumb-divider" aria-hidden="true">/</span>
        <h1>Students</h1>
    </div>

    <label class="search-box">
        <span class="search-icon" aria-hidden="true"></span>
        <input type="search" aria-label="Search students and courses" placeholder="Search students, courses...">
        <span class="search-shortcut" aria-hidden="true">/</span>
    </label>
</header>
